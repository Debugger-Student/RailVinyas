services:
  - type: web
    name: railvinyas
    runtime: python

    buildCommand: |
      pip install -r requirements.txt
      cd railvinyas-frontend
      npm install
      npm run build

    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11